kind = "web"
previewPath = "/"
title = "Tilawah Assistant"
version = "1.0.0"
id = "artifacts/tilawah-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18994

[services.development]
run = "pnpm --filter @workspace/tilawah-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tilawah-web", "run", "build" ]
publicDir = "artifacts/tilawah-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18994"
BASE_PATH = "/"
